services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${CONTAINER_NAME:-code-server}

    restart: unless-stopped

    ports:
      - "${PORT:-8080}:8080"

    environment:
      PASSWORD: ${PASSWORD:-}
      HASHED_PASSWORD: ${HASHED_PASSWORD:-}
      SUDO_PASSWORD: ${SUDO_PASSWORD:-}
      SUDO_PASSWORD_HASH: ${SUDO_PASSWORD_HASH:-}
      PROXY_DOMAIN: ${PROXY_DOMAIN:-}
      DEFAULT_WORKSPACE: ${DEFAULT_WORKSPACE:-/home/coder/project}

    volumes:
      - code_server_config:/home/coder/.config
      - code_server_data:/home/coder/.local/share/code-server
      - workspace:/home/coder/project

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  code_server_config:
  code_server_data:
  workspace:
